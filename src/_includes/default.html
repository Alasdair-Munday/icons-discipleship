<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Five Icons of Discipleship</title>
    {% if description %}
      <meta name="description" content="{{description}}"/>
    {% endif %}
    {% block head %}{% endblock %}
    <link rel="stylesheet" type="text/css" href="/static/css/style.css"/>
    {% if prism == true %}
      <link rel="stylesheet" type="text/css" href="/static/css/prism-tomorrow.css">
    {% endif %}
    <script>
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("/service-worker.js");
    </script> 
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preload" href="/static/fonts/Proxima-Nova-Light.otf" as="font" type="font/otf" crossorigin/>
    <link rel="preload" href="/static/fonts/Garland.woff2" as="font" type="font/woff2" crossorigin/>
  </head>
  <body class="from-white to-gray-200 bg-gradient-to-b">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include "./partials/navbar.html" %}

    <main id="main-content" class="container max-w-4xl bg-white shadow pb-6 pt-2 px-6">
      {{ content | safe }}
    </main>

    {% include "./partials/footer.html" %}

    <script src="/static/js/alpine.js" defer></script>

    {% if path == "home" %}
      <!-- Netlify Identity Widget -->
      <!-- Needed only if you are using Netlify Identity feature -->
      <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
    {% endif %}

  </body>
</html>
